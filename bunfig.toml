# `repos/` is a vendored git subtree (the @nestjs/observe SDK) kept as read-only
# reference. Its own *.spec.ts suites are not ours to run and need Redis/MySQL/
# Mongo; `test/conformance/` is the one place that imports from it, on purpose.
# Bun's test runner has no exclude glob, so the root `test` script names the
# directories to search instead of walking the whole tree.
[install]
exact = false
